# Builds the Fabric mod (mod/) on every push and pull request to catch compile errors early.
# A successful build of a push to main triggers "Publish Mod Release" (mod-release.yml).
name: Mod Build

on:
  push:
    paths:
      - "mod/**"
      # Merl's lines and synonyms are bundled into the mod jar.
      - "bot/data/**"
      - ".github/workflows/mod-build.yml"
  pull_request:
    paths:
      - "mod/**"
      - "bot/data/**"

defaults:
  run:
    working-directory: mod

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "microsoft"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: nice-merl
          path: mod/build/libs/
