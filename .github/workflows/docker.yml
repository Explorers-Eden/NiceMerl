# Builds the Discord bot (bot/) into niceron/nicemerl:latest.
name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "bot/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
  schedule:
    # Rebuild every 6 hours to pick up base image / dependency security updates.
    # Offset from :00, the most congested slot for scheduled workflows.
    - cron: '23 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history, so the timestamp below can come from the last bot/ commit.
          fetch-depth: 0

      # Stamp the image with the time of the last commit that touched bot/ instead
      # of the build time, so a scheduled rebuild with no real changes (or one after
      # a mod-only commit) produces the identical image digest and Watchtower
      # doesn't restart the bot for nothing.
      - name: Use last bot commit time as image timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct -- bot)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./bot
          file: ./bot/Dockerfile
          push: true
          pull: true
          provenance: false
          sbom: false
          # Unlike the website build, the cache stays on: the context is the
          # checked-out folder, so layers are only reused when file contents
          # are unchanged, and that's what keeps no-op rebuilds digest-identical.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            niceron/nicemerl:latest
            niceron/nicemerl:sha-${{ github.sha }}
