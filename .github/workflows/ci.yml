# One workflow for everything NiceMerl:
#
#   Discord bot (bot/)   test the Python code → build the Docker image niceron/nicemerl and push it to Docker Hub
#   Fabric mod  (mod/)   build the jar        → publish it as a GitHub release (newest per Minecraft version)
#
# Each part only runs when its files changed. The mod also depends on bot/data/, because Merl's lines
# and synonyms are bundled into the jar. Images and releases are only published from main.
# Every 6 hours the image is rebuilt to pick up base image and dependency security updates.
# Running it by hand (Actions → NiceMerl → Run workflow) on main does everything: test, image, build and release.
name: NiceMerl

on:
  push:
  pull_request:
  schedule:
    # Offset from :00, the most congested slot for scheduled workflows.
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Find out what changed
    runs-on: ubuntu-24.04
    outputs:
      bot: ${{ steps.filter.outputs.bot }}
      mod: ${{ steps.filter.outputs.mod }}
    steps:
      - name: Check out the repository with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide which parts need to run
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            schedule)
              bot=true; mod=false ;;
            workflow_dispatch)
              bot=true; mod=true ;;
            *)
              base="$BEFORE"
              [ "$EVENT" = "pull_request" ] && base="$PR_BASE"
              if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
                changed=$(git diff --name-only "$base" "$GITHUB_SHA")
              else
                # New branch or rewritten history: treat everything as changed.
                changed=$(git ls-files)
              fi
              echo "Changed files:"; echo "$changed"
              bot=false; mod=false
              echo "$changed" | grep -qE '^(bot/|\.github/workflows/)' && bot=true
              echo "$changed" | grep -qE '^(mod/|bot/data/|\.github/workflows/)' && mod=true
              ;;
          esac
          echo "Bot: $bot, mod: $mod"
          echo "bot=$bot" >> "$GITHUB_OUTPUT"
          echo "mod=$mod" >> "$GITHUB_OUTPUT"

  bot-test:
    name: "Bot: test the Python code"
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bot
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12 (same as the Docker image)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install the bot's dependencies
        run: pip install -r requirements.txt

      - name: Compile every Python file
        run: python -m compileall -q .

      - name: Load Merl's lines and check that every pool the code uses exists
        run: |
          python - <<'EOF'
          import json, re, pathlib
          import bot, personality  # importing loads lines.json, synonyms.json and every intent pattern
          pools = personality.POOLS
          code = "".join(p.read_text() for p in pathlib.Path(".").glob("*.py"))
          used = set(re.findall(r'pick\(\s*"([a-z_]+)"', code)) | set(personality.PREFIX_POOLS.values())
          used |= {f"asides_{m}" for m in personality.MOODS} | {f"status_{m}" for m in personality.MOODS}
          used |= {f"pb_{m}" for m in personality.PB_MOODS} | {f"reply_{t}" for t in personality.TOPICS}
          used |= {p for p, _, _ in personality.KEYWORD_INTENTS}
          used |= {f"feeling_{f}" for f in personality.FEELING_ORDER} | {"about_me"}
          used |= {f"followup_{t}" for t in personality.TOPICS} | {"friend_milestone", "friend_anniversary", "remember_topic"}
          # The mod uses the same lines.
          java = "".join(p.read_text() for p in pathlib.Path("../mod/src/main/java").rglob("*.java"))
          used |= set(re.findall(r'pick\(\s*"([a-z_]+)"\s*[,)]', java))
          used |= {f"stat_{s}" for s in json.loads(pathlib.Path("data/lines.json").read_text())["stat_milestones"] if not s.startswith("_")}
          missing = sorted(p for p in used if p not in pools)
          empty = sorted(p for p, lines in pools.items() if not lines)
          assert not missing, f"Pools used in code but missing in lines.json: {missing}"
          assert not empty, f"Empty pools in lines.json: {empty}"
          print(f"{len(pools)} pools, {sum(map(len, pools.values()))} lines, all present")
          EOF

      - name: Check that every placeholder in Merl's lines gets a value (bot and mod)
        run: python check_placeholders.py

      - name: Check that small talk and questions are told apart
        run: |
          python - <<'EOF'
          import personality as p
          talk = {"can you tell me a joke please": "joke", "thaaanks merl": "thanks", "im bored gimme ideas": "idea",
                  "hiii": "greeting", "pet peanut butter": "pet_pb", "bye merl": "goodbye", "wyd merl": "what_doing",
                  "*hugs merl*": "hug", "i beat the ender dragon": "cheer", "im so tired": "tired", "im new here": "newcomer",
                  "no thanks": "no", "ok": "ok", "NO! Stop!": "stop", "what": "confused", "wait": "wait",
                  "thats not what i asked": "wrong"}
          questions = ["how do i get a boss key", "tips for the nether", "what should i do with my wither skulls",
                       "how do i beat the ender dragon", "what song plays in the nether"]
          # Answers to "how are you?": "not bad" is meh, not bad; a question after it still goes to the wiki.
          feelings = {"pretty good, you?": ("feeling_good", True), "not bad wbu": ("feeling_meh", True),
                      "not great tbh": ("feeling_bad", False), "fine thank you": ("feeling_good", False),
                      "im good how do i get a boss key": None}
          for text, pool in talk.items():
              assert p.small_talk(text) == pool, f"{text!r} should be {pool}, got {p.small_talk(text)}"
          for text in questions:
              assert p.small_talk(text) is None, f"{text!r} is a question, not small talk"
          for text, felt in feelings.items():
              assert p.feeling(text) == felt, f"{text!r} should be {felt}, got {p.feeling(text)}"
          # Without a question, only a page that's clearly about the message is shown.
          assert p.seeks_info("where are trial chambers") and p.seeks_info("boss key?") and not p.seeks_info("i like turtles")
          assert p.clearly_about("maybe", True, "turtles") and not p.clearly_about("guess", True, "i like turtles")
          # Friendship: a milestone or anniversary is mentioned once, even if it comes a chat late.
          assert p.friendship_note(10, 0, 3, 0, "Steve")[1:] == (10, 0)
          assert p.friendship_note(11, 10, 8, 0, "Steve")[1:] == (10, 7)
          assert p.friendship_note(12, 10, 9, 7, "Steve") == (None, 10, 7)
          assert p.small_talk("do you remember me") == "remember_me" and p.small_talk("forget me") == "forget_me"
          # Conversations: two bits of small talk, "another one", confusion about the last answer, other people.
          assert p.multi_small_talk("you're funny! tell me a joke") == ("compliment_prefix", "joke")
          assert p.small_talk("one more please") == "more"
          assert p.is_clarifying("So Katter is Bosses, the Skyrtle and a Fossil?") and not p.is_clarifying("so how do i get there")
          assert p.met_question("Have you met NotNiceRon yet?") == ("NotNiceRon", True)
          assert p.met_question("do you know how to craft a bed") is None
          # Pack names starting with "Nice" aren't compliments; "nice! how…" still is.
          assert p.split_small_talk("nice mob variants cows")[0] is None
          assert p.split_small_talk("nice! how do i get a boss key")[0] == "compliment_prefix"
          # "say that again" and "what was I asking?" use the last question and answer; "another one" is still more.
          assert p.recall("say that again") == "repeat" and p.recall("what was i asking again?") == "question"
          assert p.recall("another one") is None and p.small_talk("another one") == "more"
          print("Small talk detection works")
          EOF

      - name: Check the search (project pages, question types, interests, meaning, answer lines)
        run: |
          python - <<'EOF'
          import numpy as np
          from search import Index, SURE_SCORE
          from wiki import Section
          pages = [
              Section("katters_structures/home", "Main", "Main", "", "Katter builds dungeons, towers and ruins for the server."),
              Section("katters_structures/boss_keys", "Boss Keys", "Boss Keys", "", "You get a boss key by defeating the mini bosses. Each key opens one boss room."),
              Section("katters_structures/raj_raksha", "Raj Raksha", "Raj Raksha", "", "Raj Raksha is a tiger boss with a golden crown."),
              Section("katters_structures/raj_raksha", "Raj Raksha", "Where to Find", "where-to-find", "Look for the jungle temple ruins deep in bamboo jungles."),
              Section("nice_mob_variants/home", "Main", "Main", "", "Nice Mob Variants adds new looks for cats, cows and chickens."),
              Section("nice_mob_variants/cats", "Cats", "Cats", "", "Cats come in twelve new patterns, each tied to a biome."),
              Section("fabled_roots/cats", "Cats", "Cats", "", "Fabled Roots cats are spirits that guard the old trees."),
          ]
          # A project's home page answers "who is <project>"; a "Where to Find" section answers "where".
          assert Index(pages).find("who is katter").results[0].section.path == "katters_structures/home"
          assert Index(pages).find("where is raj raksha").results[0].section.heading == "Where to Find"
          # What someone usually asks about tips a question that fits two projects.
          assert Index(pages).find("tell me about cats", interests={"fabled_roots": 1.0}).results[0].section.path == "fabled_roots/cats"
          assert Index(pages).find("tell me about cats", interests={"nice_mob_variants": 1.0}).results[0].section.path == "nice_mob_variants/cats"
          # Hybrid search: a page found only by meaning (no shared words) shows up, but never sounds sure.
          concepts = {"unlatch": 0, "opens": 0, "portal": 1, "room": 1}
          def embed(texts):
              out = np.zeros((len(texts), 4), dtype=np.float32)
              for row, text in enumerate(texts):
                  out[row, 3] = 0.3
                  for word in text.lower().replace(".", " ").split():
                      if word in concepts: out[row, concepts[word]] += 1
              return out / np.linalg.norm(out, axis=1, keepdims=True)
          found = Index(pages, embed=embed).find("unlatch the portal").results
          assert found and found[0].section.path == "katters_structures/boss_keys" and found[0].score < SURE_SCORE, found
          assert not Index(pages).find("unlatch the portal").results
          # A keyword-sure answer isn't changed by meaning.
          assert Index(pages, embed=embed).find("who is katter").results[0].section.path == "katters_structures/home"
          # The answer line is a sentence from the page that answers the question.
          index = Index(pages)
          from search import answer_line
          assert "defeating the mini bosses" in answer_line("how do i get a boss key", index.find("how do i get a boss key").results, index)
          assert "bamboo jungles" in answer_line("where is raj raksha", index.find("where is raj raksha").results, index)
          print("Search works: projects, question types, interests, meaning and answer lines")
          EOF

      - name: Check recipe pictures (pack recipe matching, vanilla crafting grids)
        run: |
          python - <<'EOF'
          import asyncio, recipes, personality
          from search import tokenize
          from PIL import Image
          # "how do I craft X" → X, like MerlLines.recipeItem in the mod.
          assert personality.recipe_item("how do I craft a waypoint hub?") == "waypoint hub"
          assert personality.recipe_item("bed recipe") == "bed" and personality.recipe_item("how do i get a boss key") is None
          # Pack recipes: exact crafting names first; mini blocks (stonecutter, named like the vanilla block) only loosely.
          def recipe(name, crafting=True):
              return recipes.Recipe(name, frozenset(tokenize(name)), "Pack", "https://x/" + name, crafting)
          m = recipes.Manifest("")
          m.recipes = [recipe("Acacia Waypoint Hub"), recipe("Portal Horn"), recipe("Crafting Table", crafting=False)]
          assert [r.name for r in m.find("portal horn")[0]] == ["Portal Horn"]
          assert not m.find("crafting table")[0] and m.find("crafting table")[1]
          assert [r.name for r in m.find("waypoint hub")[1]] == ["Acacia Waypoint Hub"]
          # Vanilla: the crafting grid from Minecraft Wiki markup, drawn with (stubbed) sprites.
          slot = '<span class="invslot"><span class="invslot-item"><a title="Oak Planks"><img src="/images/Invicon_Oak_Planks.png"></a></span></span>'
          empty = '<span class="invslot"></span>'
          row = '<span class="mcui-row">' + slot + slot + empty + '</span>'
          html = ('<span class="mcui mcui-Crafting_Table"><span class="mcui-input">' + row + row + '<span class="mcui-row">' + empty * 3
                  + '</span></span><span class="mcui-output"><span class="invslot"><span class="invslot-item"><img src="/images/Invicon_Crafting_Table.png">'
                  + '</span></span></span></span>')
          grid = recipes.find_grid(html, "https://minecraft.wiki", "crafting table")
          assert grid and sum(1 for x in grid.inputs if x) == 4 and grid.title == ""
          drawer = recipes.Drawer()
          for url in grid.inputs + [grid.output]:
              if url:
                  drawer.sprites[url] = Image.new("RGBA", (recipes.ITEM, recipes.ITEM), (200, 150, 80, 255))
          png = asyncio.run(drawer.draw(None, grid))
          assert png.startswith(b"\x89PNG")
          print("Recipe pictures work: pack recipes, mini blocks, vanilla grids")
          EOF

      - name: Check block palettes (questions, block names, palettes, picture)
        run: |
          python - <<'EOF'
          import asyncio, random, palettes, personality
          # Questions (the same patterns as MerlLines.palette in the mod: data/palette_patterns.json).
          def got(q):
              a = personality.palette(q)
              return ("none" if a is None else "again" if a.again else "random" if a.random else "held" if a.held
                      else "this" if a.block is None else ("loose=" if a.loose else "block=") + a.block)
          for line in open("eval/palette_questions.txt"):
              if line.strip() and not line.startswith("#"):
                  q, want = line.rstrip("\n").split("|")
                  assert got(q) == want, (q, got(q), want)
          assert personality.palette_follow_up("shuffle") and not personality.palette_follow_up("what")
          colors = palettes.load()
          assert len(colors) > 300, len(colors)
          # Names: exact, partial blocks (stairs → planks), loose words; "diamonds" only loosely.
          assert palettes.by_name(colors, "oak stairs") == "oak_planks"
          assert palettes.by_name(colors, "stone brick wall") == "stone_bricks"
          assert palettes.by_name(colors, "copper") == "copper_block" and palettes.name("copper_block") == "Block of Copper"
          # Names as in the game (the picture loads each block's icon from the Minecraft Wiki by name).
          assert [palettes.name(b) for b in ("resin_block", "hay_block", "magma_block", "lapis_block", "jack_o_lantern")] == [
              "Block of Resin", "Hay Bale", "Magma Block", "Block of Lapis Lazuli", "Jack o'Lantern"]
          assert palettes.by_name(colors, "diamonds", exact=True) is None and palettes.by_name(colors, "blorp") is None
          # Palettes: different blocks from dark to light, one per color set, the start included.
          for base in ["deepslate_bricks", "oak_planks", "white_concrete", "copper_block", palettes.random_base(colors)]:
              for seed in range(5):
                  p = palettes.palette(colors, base, random.Random(seed))
                  assert len(p) == palettes.SIZE and len(set(p)) == palettes.SIZE and base in p, (base, p)
                  assert [colors[b]["lab"][0] for b in p] == sorted(colors[b]["lab"][0] for b in p)
                  sets = [palettes.family(b) for b in p if palettes.family(b) in palettes.ONE_PER_PALETTE]
                  assert len(sets) == len(set(sets)), (base, p)
          # Several blocks in one palette, any block as a start (ores, plants), building blocks for loose names.
          assert palettes.blocks_by_name(colors, "prismarin and gold") == ["prismarine", "gold_block"]
          assert palettes.blocks_by_name(colors, "deepslate lapis ore") == ["deepslate_lapis_ore"]
          assert palettes.blocks_by_name(colors, "cactus") == ["cactus"] and palettes.blocks_by_name(colors, "prismarine and the moon") == []
          p = palettes.palette(colors, "prismarine", random.Random(1), ("gold_block",))
          assert "gold_block" in p and len(p) == palettes.SIZE, p
          p = palettes.palette(colors, "cactus", random.Random(1))
          assert all(colors[b].get("pick", True) for b in p if b != "cactus"), p
          # The picture, without the wiki's icons (swatches only).
          class NoWeb:
              def get(self, *a, **k):
                  raise OSError("offline")
          png = asyncio.run(palettes.render(NoWeb(), colors, palettes.palette(colors, "stone")))
          assert png.startswith(b"\x89PNG")
          print("Block palettes work: questions, names, palettes, picture")
          EOF

      - name: Check fun facts and jokes about something or someone
        run: |
          python - <<'EOF'
          import personality
          # Questions (the same patterns as MerlLines.topicRequest in the mod: data/topic_patterns.json).
          for line in open("eval/topic_questions.txt"):
              if line.strip() and not line.startswith("#"):
                  q, want = line.rstrip("\n").split("|")
                  r = personality.topic_request(q)
                  assert ("none" if r is None else f"{r[0]}:{r[1]}") == want, (q, r, want)
          # Facts and jokes found by what they mention.
          assert personality.about("fact", "axolotls") and personality.about("fact", "the ender dragon")
          assert len(personality.about("joke", "creepers")) >= personality.MANY_TOPIC_JOKES
          # Jokes about people: friendly templates, each with the name in it, and plenty of them.
          people = personality.LINES["pools"]["joke_about"]
          assert len(people) >= 480 and all("{name}" in j for j in people), len(people)
          assert len(personality.LINES["pools"]["tip_about"]) >= 80 and personality.about("joke", "ron") == []
          # "another tip? i dont understand that one": a request next to a comment; a real question still searches.
          assert personality.multi_small_talk("can u give me another tip? i dont understand that one") == (None, "tip")
          assert personality.multi_small_talk("thanks! the boss key doesnt work") == (None, None)
          # Build ideas and player lookups.
          assert personality.small_talk("Any idea for a new structure for KS?") == "build_idea"
          assert len(personality.LINES["pools"]["build_idea"]) >= 1000
          assert personality.player_lookup("who is the player MrNox?") == ("MrNox", True)
          assert personality.player_lookup("Who is Nox?") == ("Nox", False) and personality.player_lookup("who is the strongest boss") is None
          print("Facts and jokes about things and people work")
          EOF

      - name: Check vanilla names (no typo fixes for real Minecraft words, the page for a named thing)
        run: |
          python - <<'EOF'
          import search, vanilla
          from wiki import Section
          # "minecart" isn't a typo of "minecraft", but real typos are still fixed.
          pages = [("Minecraft", "minecraft server rules and tips"), ("Livestock Breeder", "crafting a livestock breeder")]
          index = search.Index([Section(path=f"p{i}", page_title=t, heading="", anchor="", text=x, vanilla=False, meta="")
                                for i, (t, x) in enumerate(pages)], {}, set())
          assert index.find("how do i craft a minecart", 3).corrections == {}
          assert index.find("livestok breder", 3).corrections == {"livestok": "livestock", "breder": "breeder"}
          # The vanilla thing a question names.
          assert vanilla.named_thing("how many different uses are there for iron ingots?") == "Iron Ingot"
          assert vanilla.named_thing("How do i craft a minecart?") == "Minecart"
          assert vanilla.named_thing("how do i get a boss key") is None
          assert vanilla.named_thing("how do i move enchantments to another item") is None
          print("Vanilla names work")
          EOF

      - name: Check that the bot starts (without logging in to Discord)
        env:
          DISCORD_TOKEN: ci
          CHANNEL_ID: "1"
          SEMANTIC_MODEL: ""
        run: |
          python - <<'EOF'
          import asyncio, bot
          async def main():
              client = bot.NiceMerl()
              # discord.py's own HTTP client must not be replaced by anything of ours.
              assert type(client.http).__name__ == "HTTPClient", type(client.http)
              await client._async_setup_hook()
              await client.close()
          asyncio.run(main())
          print("The bot starts")
          EOF

      - name: Check that the stack in SETUP.md matches portainer-stack.yml
        run: |
          python - <<'EOF'
          import re, pathlib
          setup = pathlib.Path("SETUP.md").read_text()
          shown = re.search(r"```yaml\n(.*?)```", setup, re.S).group(1)
          shown = "\n".join(line[3:] for line in shown.splitlines()).strip()
          stack = pathlib.Path("portainer-stack.yml").read_text()
          stack = "\n".join(l for l in stack.splitlines() if not l.startswith("#")).strip()
          assert shown == stack, "The stack in SETUP.md differs from portainer-stack.yml, update both"
          print("SETUP.md shows the current stack")
          EOF

  bot-image:
    name: "Bot: build and push the Docker image"
    needs: [changes, bot-test]
    if: >-
      needs.changes.outputs.bot == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository with full history
        uses: actions/checkout@v6
        with:
          # Full history, so the timestamp below can come from the last bot/ commit.
          fetch-depth: 0

      # Stamp the image with the time of the last commit that touched bot/ instead of the build
      # time, so a scheduled rebuild with no real changes produces the identical image digest
      # and Watchtower doesn't restart the bot for nothing.
      - name: Use the last bot commit time as the image timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct -- bot)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build the image and push it as niceron/nicemerl:latest
        uses: docker/build-push-action@v7
        with:
          context: ./bot
          file: ./bot/Dockerfile
          push: true
          pull: true
          provenance: false
          sbom: false
          # The context is the checked-out folder, so layers are only reused when file contents
          # are unchanged; that's what keeps no-op rebuilds digest-identical.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            niceron/nicemerl:latest
            niceron/nicemerl:sha-${{ github.sha }}

  mod-build:
    name: "Mod: build the jar"
    needs: changes
    if: needs.changes.outputs.mod == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mod
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Make sure the Gradle wrapper is genuine
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Python 3.12 for the release scripts
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read version and Minecraft version from tools/release_infos.yml
        id: meta
        run: |
          pip install pyyaml
          python tools/scripts/read-release-metadata.py

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "microsoft"

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v6

      - name: Build the mod jar (version ${{ steps.meta.outputs.version_number }})
        run: ./gradlew build -Pversion=${{ steps.meta.outputs.version_number }}

      - name: Upload the jar as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: nice-merl
          path: mod/build/libs/

  mod-release:
    name: "Mod: publish the GitHub release"
    needs: [changes, mod-build]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Never publish two releases at the same time.
    concurrency:
      group: mod-release
      cancel-in-progress: false
    defaults:
      run:
        working-directory: mod
    steps:
      - name: Check out the repository (release scripts and changelog)
        uses: actions/checkout@v6

      - name: Set up Python 3.12 for the release scripts
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read version, tag and release name from tools/release_infos.yml
        id: meta
        run: |
          pip install pyyaml
          python tools/scripts/read-release-metadata.py

      - name: Download the jar built by the previous job
        uses: actions/download-artifact@v7
        with:
          name: nice-merl
          path: mod/build/libs/

      # Pushing without raising the version refreshes the jar of that version's release.
      - name: Create or update release ${{ steps.meta.outputs.tag_name }} with changelog.log as notes
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          CHANGELOG_PATH: ${{ steps.meta.outputs.changelog_path }}
          JAR_NAME: ${{ steps.meta.outputs.jar_name }}
          BUILT_JAR: ${{ steps.meta.outputs.built_jar }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
        run: bash tools/scripts/create-or-update-github-release.sh

      - name: Delete older releases for Minecraft ${{ steps.meta.outputs.mc_version }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          MC_VERSION: ${{ steps.meta.outputs.mc_version }}
        run: bash tools/scripts/delete-older-releases.sh
