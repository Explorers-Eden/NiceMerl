# Builds the Fabric mod (mod/) and publishes it as a GitHub release.
# Runs automatically after every successful "Mod Build" of a push to main, or by hand.
# Pushing without raising the version refreshes the jar of that version's release.
# Only the newest release per Minecraft version is kept; older ones are deleted.
# Version, subtitle and Minecraft versions come from mod/tools/release_infos.yml,
# the release notes from mod/changelog.log.
name: Publish Mod Release

on:
  workflow_run:
    workflows: ["Mod Build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: mod

# Never publish two releases at the same time.
concurrency:
  group: mod-release
  cancel-in-progress: false

jobs:
  build-and-release:
    # Only after a green build of a push (not a pull request).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    env:
      # The commit that was built: the triggering push, or the branch a manual run was started on.
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Read release metadata
        id: meta
        run: python tools/scripts/read-release-metadata.py

      - uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "microsoft"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build mod jar
        run: ./gradlew build -Pversion=${{ steps.meta.outputs.version_number }}

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          CHANGELOG_PATH: ${{ steps.meta.outputs.changelog_path }}
          JAR_NAME: ${{ steps.meta.outputs.jar_name }}
          BUILT_JAR: ${{ steps.meta.outputs.built_jar }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
        run: bash tools/scripts/create-or-update-github-release.sh

      - name: Delete older releases for the same Minecraft version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          MC_VERSION: ${{ steps.meta.outputs.mc_version }}
        run: bash tools/scripts/delete-older-releases.sh
